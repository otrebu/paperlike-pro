# paperlike hotkeys for sway. UNTESTED: the tool itself was only tested on Hyprland 0.56.
# Paste these lines into your sway config, or `include` this file.
# Mod4 is Super, Mod1 is Alt. The keys are suggestions: check they're free in your config first.
# If ~/.local/bin isn't on sway's PATH, write the full path to paperlike.

bindsym Mod4+Mod1+c exec paperlike clear
bindsym Mod4+Mod1+Shift+c exec paperlike clear --full
bindsym Mod4+Mod1+a exec paperlike mode a2
bindsym Mod4+Mod1+d exec paperlike mode floyd
bindsym Mod4+Mod1+p exec paperlike mode 16
bindsym Mod4+Mod1+w exec paperlike wake

# Simpler than the systemd unit: start the watcher with sway.
# exec paperlike watch
