# paperlike hotkeys for Hyprland's classic hyprland.conf syntax.
# UNTESTED. The Lua version (hyprland-binds.lua) follows Hyprland 0.56's Lua API.
# Paste these lines into hyprland.conf, or `source =` this file.
# The keys are suggestions: check they're free in your config first.
# If ~/.local/bin isn't on Hyprland's PATH, write the full path to paperlike.

bind = SUPER ALT, C, exec, paperlike clear
bind = SUPER ALT SHIFT, C, exec, paperlike clear --full
bind = SUPER ALT, A, exec, paperlike mode a2
bind = SUPER ALT, D, exec, paperlike mode floyd
bind = SUPER ALT, P, exec, paperlike mode 16
bind = SUPER ALT, W, exec, paperlike wake

# Simpler than the systemd unit: start the watcher with Hyprland.
# exec-once = paperlike watch
